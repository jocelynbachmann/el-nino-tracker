<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time Value</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 60px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; }
    input, button { font-size: 1rem; padding: 8px 12px; }
    #result { margin-top: 20px; font-size: 1.2rem; }
    .error { color: #c0392b; }
  </style>
</head>
<body>
  <h1>Time → Value</h1>
  <form id="form">
    <input type="time" id="time" required>
    <button type="submit">Get value</button>
  </form>
  <div id="result"></div>

  <script>
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const out = document.getElementById("result");
      const time = document.getElementById("time").value;
      const res = await fetch("/api/value", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ time })
      });
      const data = await res.json();
      out.className = res.ok ? "" : "error";
      out.textContent = res.ok ? `${data.time} → ${data.value}` : data.error;
    });
  </script>
</body>
</html>
